
name: Node.js CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html
          echo "Build output verified successfully"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: dist/
          if-no-files-found: error
  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-files
          path: dist/

      - name: Configure SSH
        env:
          EC2_SSH_KEY_B64: ${{ secrets.EC2_SSH_KEY_B64 }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$EC2_SSH_KEY_B64" | base64 --decode > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

      
      
      
      - name: Diagnose SSH connection
        run: |
          echo "Checking TCP port 22..."
          timeout 10 bash -c '</dev/tcp/13.51.206.113/22' \
            && echo "TCP port 22 is reachable" \
            || echo "TCP port 22 is NOT reachable"

          echo "Checking SSH host key..."
          ssh-keyscan -T 10 -v 13.51.206.113 \
            > /tmp/host_keys 2> /tmp/keyscan_error || true

          cat /tmp/keyscan_error

          if [ -s /tmp/host_keys ]; then
            cat /tmp/host_keys >> ~/.ssh/known_hosts
            echo "Host key received"
          else
            echo "No host key received"
            exit 1
          fi




      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          scp -i ~/.ssh/ec2_key \
            -o BatchMode=yes \
            dist/index.html \
            "$EC2_USER@$EC2_HOST:/var/www/html/index.html"

